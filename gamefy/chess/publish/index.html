<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>群聊象棋</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./config.js"></script>
  <script type="module" src="./game.js"></script>
</head>
<body>
  <main>
    <header><h1>♟ 群聊象棋</h1><p id="status">正在连接棋局…</p></header>
    <section id="lobby" hidden><h2>选择棋局</h2><button id="refresh-rooms" type="button">刷新棋局</button><div id="rooms"></div></section>
    <section class="layout">
      <div class="table">
        <button id="back-to-rooms" type="button">返回棋局列表</button>
        <div id="players">红方 · 黑方</div>
        <div class="clocks"><span>🔴 <b id="red-clock">15:00</b></span><span>⚫ <b id="black-clock">15:00</b></span></div>
        <div class="step-clock">本步剩余 <b id="move-clock">60</b> 秒</div>
        <div id="board" aria-label="中国象棋棋盘"></div>
        <div id="claim-panel" hidden><label>四位入座码 <input id="claim-code" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></label><button id="claim-seat" type="button">抢第二席</button></div>
        <p id="feedback" role="status"></p>
        <div id="actions" hidden><button data-action="offer_undo">请求悔棋</button><button data-action="offer_draw">求和</button><button data-action="resign">认输</button></div>
        <div id="respond" hidden><span id="offer-label"></span><button data-action="accept_undo">同意悔棋</button><button data-action="decline_undo">拒绝悔棋</button><button data-action="accept_draw">同意和棋</button><button data-action="decline_draw">拒绝和棋</button></div>
      </div>
      <aside><h2>着法</h2><div id="moves-list"></div><h2>本局聊天</h2><div id="chat-list" aria-live="polite"></div><div id="chat-form"><input id="chat-input" maxlength="300" placeholder="棋手和观众都可以发言"><button id="chat-send" type="button">发送</button></div></aside>
    </section>
  </main>
</body>
</html>
