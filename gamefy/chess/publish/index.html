<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>群聊象棋</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./config.js"></script>
  <script type="module" src="./game.js"></script>
</head>
<body>
  <main>
    <header><div class="brand"><span class="seal">棋</span><div><h1>群聊象棋</h1><small>以棋会友 · 落子有声</small></div></div><p id="status">正在连接棋局…</p></header>
    <section id="lobby" hidden><h2>选择棋局</h2><button id="refresh-rooms" type="button">刷新棋局</button><div id="rooms"></div></section>
    <section class="layout">
      <div class="table">
        <div class="table-toolbar"><button id="back-to-rooms" type="button">‹ 棋局列表</button><div class="step-clock">本步 <b id="move-clock">60</b> 秒</div></div>
        <div id="players" class="sr-only">红方 · 黑方</div>
        <div id="black-player" class="player"><span class="avatar black">將</span><div class="player-info"><small id="black-side">黑方</small><strong id="black-name">等待入座</strong></div><b id="black-clock" class="clock">15:00</b></div>
        <div id="board" aria-label="中国象棋棋盘"></div>
        <div id="red-player" class="player"><span class="avatar red">帥</span><div class="player-info"><small id="red-side">红方</small><strong id="red-name">等待入座</strong></div><b id="red-clock" class="clock">15:00</b></div>
        <div id="claim-panel" hidden><label>四位入座码 <input id="claim-code" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required></label><button id="claim-seat" type="button">抢第二席</button></div>
        <p id="feedback" role="status"></p>
        <div id="actions" hidden><button data-action="offer_undo">请求悔棋</button><button data-action="offer_draw">求和</button><button data-action="resign">认输</button></div>
        <div id="respond" hidden><span id="offer-label"></span><button data-action="accept_undo">同意悔棋</button><button data-action="decline_undo">拒绝悔棋</button><button data-action="accept_draw">同意和棋</button><button data-action="decline_draw">拒绝和棋</button></div>
      </div>
      <aside><details class="moves"><summary>着法记录</summary><div id="moves-list"></div></details><div class="chat-heading"><h2>棋桌闲聊</h2><small>棋手与观众均可发言</small></div><div id="chat-list" aria-live="polite"></div><div id="chat-form"><input id="chat-input" aria-label="聊天内容" maxlength="300" placeholder="聊聊这盘棋…"><button id="chat-send" type="button">发送</button></div></aside>
    </section>
  </main>
</body>
</html>
