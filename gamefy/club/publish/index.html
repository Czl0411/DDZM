<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#173f37">
  <title>摸鱼 Club</title>
  <link rel="stylesheet" href="./style.css">
  <style>[hidden]{display:none!important}@media(max-width:420px){.hand{justify-content:flex-start}}</style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <button id="home" class="brand" type="button" aria-label="返回 Club 首页"><span>摸</span><div><strong>摸鱼 Club</strong><small>群友的游戏会所</small></div></button>
      <div class="top-actions"><span id="identity" class="identity">连接中</span><button id="refresh" class="icon-button" type="button" aria-label="刷新">↻</button></div>
    </header>
    <p id="feedback" class="feedback" role="status" aria-live="polite"></p>

    <section id="club-home" class="screen club-home-screen">
      <div class="club-home-layout">
        <div class="hero"><span class="hero-label">TONIGHT'S CLUB</span><h1>今晚，开哪一桌？</h1><p>和群友下一盘、打一局，或者开桌麻将。</p></div>
        <div class="game-panel">
          <div class="section-head"><div><span>CLUB GAMES</span><h2>游戏大厅</h2></div><b>4 款</b></div>
          <div id="game-grid" class="game-grid"></div>
        </div>
      </div>
    </section>

    <section id="mahjong-lobby" class="screen lobby-screen" hidden>
      <div class="page-title"><button id="club-back" class="icon-button" type="button">←</button><div><span>摸鱼 Club</span><h1>立直麻将</h1></div><button id="create-room" class="primary compact" type="button">开一桌</button></div>
      <div class="mahjong-lobby-layout">
        <div class="mahjong-banner"><div><span class="eyebrow">RIICHI MAHJONG</span><b>四人立直</b><p>经典日麻规则<br>东风战 / 半庄战</p></div><span>🀄</span></div>
        <div class="room-panel">
          <div class="section-head"><div><span>TABLES</span><h2>当前牌桌</h2></div><b id="room-count">0 桌</b></div>
          <div id="rooms" class="room-list"></div>
        </div>
      </div>
    </section>

    <section id="table" class="screen table-screen" hidden>
      <div class="table-head"><button id="lobby-back" class="icon-button" type="button" aria-label="返回麻将大厅">←</button><div><span id="round-label">候场</span><h2 id="table-title">牌桌</h2></div><div class="table-head-actions"><b id="timer">--</b><button id="fullscreen" class="icon-button" type="button" aria-label="进入全屏">全</button><button id="chat-toggle" class="icon-button" type="button">聊</button></div></div>
      <div id="waiting" class="waiting-card" hidden>
        <div class="waiting-meta"><span id="room-kind">休闲房</span><strong id="room-code">----</strong></div>
        <div id="seats" class="waiting-seats"></div>
        <div id="claim-controls" class="inline-form" hidden><input id="seat-code" maxlength="4" inputmode="numeric" placeholder="输入群内 4 位入座码"><button id="claim" class="primary">入座</button></div>
        <div id="waiting-actions" class="action-row" hidden><button id="share-room" class="secondary">邀请</button><button id="leave" class="secondary">离开</button><button id="ready" class="secondary">准备</button><button id="start" class="primary">开始</button></div>
      </div>
      <div id="mahjong-table" class="mahjong-table" hidden>
        <div id="opponent-top" class="player player-top"></div><div id="opponent-left" class="player player-left"></div><div id="opponent-right" class="player player-right"></div>
        <div class="board-center"><div id="dora" class="dora"></div><div id="turn-status" class="turn-status"></div><div id="rivers" class="rivers"></div></div>
        <div id="melds" class="melds"></div>
        <div id="action-bar" class="action-bar"></div>
        <div id="hand" class="hand" aria-label="我的手牌"></div>
        <div id="self-player" class="self-player"></div>
      </div>
      <div id="result" class="result-sheet" hidden></div>
      <aside id="chat-drawer" class="chat-drawer" hidden><div class="chat-head"><strong>牌桌聊天</strong><button id="chat-close" class="icon-button">×</button></div><div id="messages" class="messages"></div><div class="inline-form"><input id="chat-input" maxlength="300" placeholder="玩家与观众都能发言"><button id="chat-send" class="primary">发送</button></div></aside>
    </section>
  </main>

  <dialog id="create-dialog"><form method="dialog" class="dialog-card"><div><span class="eyebrow">CREATE TABLE</span><h2>新建麻将房</h2></div><label>房间类型<select id="room-type"><option value="coin">摸鱼币房 · 100 币</option><option value="casual">休闲房 · 免费</option></select></label><label>场次<select id="match-mode"><option value="east">东风战</option><option value="south">半庄战</option></select></label><p>摸鱼币房奖池：第 1～4 名分别获得 200 / 120 / 60 / 20 币。</p><div class="action-row"><button value="cancel" class="secondary">取消</button><button id="confirm-create" value="default" class="primary">创建牌桌</button></div></form></dialog>
  <script type="module" src="./game.js"></script>
</body>
</html>
