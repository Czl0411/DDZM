<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1217"><title>雾境 · 四格战阵 · 第三版</title><link rel="stylesheet" href="./style.css"></head>
<body><div id="game-viewport"><div id="game-shell"><header><a class="brand" href="#" id="home"><b>雾境</b><span>王冠与群鸦 · 四格战阵 · 第三版</span></a><nav><button id="fullscreen">全屏</button><button id="rules">规则</button><button id="reconnect">重新连接</button></nav></header>
<p id="feedback" role="status" aria-live="polite">正在读取平台身份…</p><main id="main"><section class="hero"><div><p class="eyebrow">MISTREALM · CLASSIC</p><h1>每张牌，<br>都有下一步。</h1><p>正在准备你的军团…</p></div></section></main>
<aside id="channel" class="channel" aria-label="公共频道聊天" hidden><button id="channel-toggle" class="channel-toggle" type="button" aria-label="公共频道聊天" aria-controls="channel-panel" aria-expanded="false"><span>公共频道</span><small id="social-online">连接中</small><b id="channel-preview">正在连接…</b><i id="channel-unread" hidden>0</i><span class="channel-chevron" aria-hidden="true">⌄</span></button><button id="social-notice" type="button" hidden aria-live="polite">邀请</button><section id="channel-panel" class="channel-panel" hidden><header><div><b>旅人会馆</b><small>相逢雾境 · 以牌会友</small></div><button id="channel-close" type="button" aria-label="收起聊天">⌃</button></header><div class="channel-body"><nav class="channel-tabs" aria-label="社交频道"><button data-social-tab="chat" class="active">公共频道</button><button data-social-tab="all">全服玩家</button><button data-social-tab="friends">我的好友</button><button data-social-tab="messages">好友私聊 <i id="social-message-count"></i></button><button data-social-tab="requests">好友申请 <i id="social-request-count"></i></button><button data-social-tab="invites">挑战邀请 <i id="social-invite-count"></i></button></nav><section id="channel-chat"><div id="channel-messages" class="channel-messages"></div><button id="channel-challenge" class="secondary" type="button">发布约战</button><div id="channel-compose" class="channel-compose"><input id="channel-input" aria-label="公共频道消息" maxlength="200" autocomplete="off" placeholder="和雾境旅人说点什么…"><button id="channel-send" type="button">发送</button></div></section><section id="private-chat" hidden aria-label="好友私聊"><header><button id="private-back" type="button" aria-label="返回私聊列表">‹</button><div><b id="private-name"></b><small id="private-status"></small></div><span>私聊</span></header><button id="private-older" type="button" hidden>查看更早消息</button><div id="private-messages" aria-label="私聊消息"></div><p id="private-feedback" role="status"></p><div class="private-compose"><input id="private-input" maxlength="200" autocomplete="off" placeholder="给好友留言…" aria-label="私聊内容"><button id="private-send" type="button">发送</button></div></section><section id="social-view" hidden><div class="social-toolbar"><h3 id="social-heading">全服旅人</h3><div id="social-search-form"><input id="social-search" maxlength="40" placeholder="搜索昵称 / UID" aria-label="搜索玩家"><button id="social-search-button" type="button">搜索</button></div></div><p id="social-description">在线优先</p><div id="social-list"></div><p id="social-feedback" role="status" aria-live="polite"></p><nav id="social-pages" aria-label="玩家列表分页"></nav></section></div></section></aside>
<section id="action-reveal" hidden aria-label="出牌展示"><div id="action-reveal-content" role="status" aria-live="polite"></div><button id="skip-reveal" type="button">点击跳过</button></section>
<dialog id="modal"><button id="close-modal" aria-label="关闭" class="close">×</button><div id="modal-content"></div></dialog>
<footer>四格战阵 · 第三版 · 原创世界 · 五大阵营</footer><section id="screen-entry"><div><p class="eyebrow">MISTREALM · 王冠与群鸦</p><h1>雾境</h1><p>横握手机，展开你的战场</p><button id="enter-game" class="primary">进入游戏</button><small id="screen-hint">点击即尝试全屏，并自动切换横屏画面</small></div></section></div></div><script type="module" src="./game.js"></script></body></html>
