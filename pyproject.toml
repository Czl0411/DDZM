[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dzmm-bot"
version = "0.1.0"
requires-python = ">=3.13"

[project.optional-dependencies]
dzmm = ["playwright>=1.49,<2"]

[project.scripts]
dzmm-read = "dzmm_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
